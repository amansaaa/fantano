# CI/CD: checks every push and pull request, so a broken change shows up as a red x on GitHub
# instead of being found later while running the pipeline. a push to main that passes every
# check is then deployed to cloud run on its own.
#
# three check jobs, they run at the same time:
#   pipeline - installs the exact locked packages, runs the linter, then runs all the tests
#   schema   - starts a real MySQL 8.4 and loads db/schema.sql into it, to prove the tables still build
#   web      - installs the exact locked packages, then lints, type-checks, tests, and builds the next.js app
# then, only for pushes to main and only if all three passed:
#   deploy   - builds the web image, pushes it to artifact registry, and puts it live on cloud run
#
# the checks use no API keys or secrets: the tests never touch YouTube, Gemini, or a real database.
# deploy logs in to google cloud with workload identity federation (github proves who it is
# with a short-lived token), so there's no google key stored in github at all. setup: CLAUDE.md §10.
# to run the same checks on your mac:
#   cd pipeline && uv run ruff check . && uv run pytest
#   cd web && npm run lint && npm run typecheck && npm test && npm run build

name: CI

on:
  push:
    branches: [main]
  pull_request:

# a new push to the same branch cancels the older run that's still going, no point finishing it
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# the jobs only need to read the code
permissions:
  contents: read

jobs:
  # --- lint + tests for the python pipeline ---
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7

      # setup-uv only publishes exact versions (no short v10 tag), so pin the full one
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      # --locked fails if uv.lock doesn't match pyproject.toml, so a forgotten lock update gets caught here
      - name: Install packages
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      # every test feeds a known input to the real code and checks the output we expect
      - name: Test
        run: uv run pytest

  # --- the schema loads into a real MySQL 8.4 ---
  schema:
    runs-on: ubuntu-latest
    services:
      # same image as docker-compose.yml. these passwords only exist inside this throwaway container
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: fantano
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7

      # runs the mysql client inside the service container, so it's the 8.4 client, not whatever the runner has
      - name: Load schema.sql
        run: docker exec -i ${{ job.services.mysql.id }} mysql -uroot -pci-root fantano < db/schema.sql

      # all 7 tables should exist. if one CREATE TABLE fails, the step above already fails, this is a second check
      - name: Check all 7 tables exist
        run: |
          table_count=$(docker exec ${{ job.services.mysql.id }} mysql -uroot -pci-root -N -e \
            "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'fantano'")
          echo "tables: $table_count"
          test "$table_count" -eq 7

  # --- lint + type check + build for the web app ---
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # npm ci installs exactly what package-lock.json says, and fails if it's out of date
      - name: Install packages
        run: npm ci

      - name: Lint
        run: npm run lint

      # next writes route types like LayoutProps into .next/types/ during dev and build. a fresh
      # checkout has no .next/, so typegen creates them first or tsc can't find them
      - name: Type check
        run: npm run typecheck

      # the pure logic (the round-robin track rule, watch links). no database, like the pipeline tests
      - name: Test
        run: npm test

      # no database here on purpose: every page that reads MySQL is rendered per request,
      # so the build never runs a query. if one ever did, this step would fail
      - name: Build
        run: npm run build

  # --- deploy the web app to cloud run (pushes to main only, after every check passed) ---
  deploy:
    needs: [pipeline, schema, web]
    # pull requests only get checked, never deployed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # id-token: write lets this job ask github for the short-lived token google trusts
    permissions:
      contents: read
      id-token: write
    env:
      # tagged with the commit, so every cloud run revision points at the exact code it runs
      IMAGE: northamerica-northeast1-docker.pkg.dev/fantano-amansa/fantano/web:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      # trades github's token for google credentials as the github-deployer service account.
      # google only accepts tokens from this repo (the pool's attribute condition, CLAUDE.md §10)
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/731244264806/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@fantano-amansa.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      # lets docker push log in to artifact registry with those credentials
      - name: Log docker in to artifact registry
        run: gcloud auth configure-docker northamerica-northeast1-docker.pkg.dev --quiet

      # the runner is already x86 like cloud run, so no --platform flag needed (unlike the mac)
      - name: Build the image
        run: docker build -t "$IMAGE" web

      - name: Push the image
        run: docker push "$IMAGE"

      # only the image changes: cloud run keeps everything else from the last deploy (service
      # account, cloud sql socket, env vars, the password secret, instance limits)
      - name: Deploy to cloud run
        run: gcloud run deploy fantano-web --image "$IMAGE" --region northamerica-northeast1 --project fantano-amansa --quiet
